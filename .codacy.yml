---
# Scope static analysis to shipped source code. Test fixtures, mocks and the
# example config files are intentionally excluded — they are not part of the
# extension's runtime and otherwise trip secret scanners (fake PEM keys in
# examples/) and security linters on test/mock code.
exclude_paths:
  - 'examples/**'
  - '**/__tests__/**'
  - 'src/__mocks__/**'
  - 'src/setupTests.ts'
  - 'coverage/**'
  - 'out/**'
  - 'dist/**'
